<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rise & Brine Team</title>
    <link rel="shortcut icon" href="/asset/favsquid.ico" type="image/x-icon">
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>
    <main class="team">
        <nav>
            <a href="/">HOME</a>
            <a href="/team/">TEAM</a>
            <a href="/blog/">NEWS</a>
        </nav>
        <h1 class="engrave">Meet the Team</h1>
        <div class="team-scroller">
            <article id="tc-1" class="team-card">
                <img class="team-photo" src="/asset/cards/Card_Ker.png" alt="Ker">
            </article>
            <article id="tc-2" class="team-card">
                <img class="team-photo" src="/asset/cards/Card_Liam.png" alt="Liam">
            </article>
            <article id="tc-3" class="team-card">
                <img class="team-photo" src="/asset/cards/Card_Mai.png" alt="Mai">
            </article>
            <article id="tc-4" class="team-card">
                <img class="team-photo" src="/asset/cards/Card_Marcelo.png" alt="Marcelo">
            </article>
            <article id="tc-5" class="team-card">
                <img class="team-photo" src="/asset/cards/Card_Max.png" alt="Max">
            </article>
            <article id="tc-6" class="team-card">
                <img class="team-photo" src="/asset/cards/Card_Rex.png" alt="Rex">
            </article>
            <article id="tc-7" class="team-card">
                <img class="team-photo" src="/asset/cards/Card_Seb.png" alt="Card_Sebesation">
            </article>
        </div>
    </main>
    <footer>
        <h2>CONTACT</h2>
        <ul class="contact">
            <li>📧 <a href="mailto:riseandbrinegames@gmail.com">riseandbrinegames@gmail.com</a></li>
        </ul>
    </footer>
</body>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll('.team-card').forEach((el, i) => {
      el.style.setProperty('--i', (Math.random() * 14) - 7);
    });
  });
</script>
</html>
